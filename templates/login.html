<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<h2>Login</h2>

<form id="loginForm">

    <input
    type="email"
    id="email"
    placeholder="Email"
    required>

    <br><br>

    <input
    type="password"
    id="password"
    placeholder="Password"
    required>

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<br>

<a href="/register">
Create Account
</a>

<script>

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    let response =
    await fetch(
    "/login",
    {

        method:"POST",

        headers:{
            "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

            email:
            document
            .getElementById("email")
            .value,

            password:
            document
            .getElementById("password")
            .value
        })

    });

    let data =
    await response.json();

    if(data.status==="success"){

        localStorage.setItem(
        "user_id",
        data.user_id
        );

        window.location.href="/";
    }

    else{

        alert(
        "Invalid Login"
        );
    }

});

</script>

</body>
</html>
